<script>
/* =====================================================================
   SGC – Frontend. SOLO presenta datos y valida visualmente.
   Todo el cálculo académico y la validación definitiva ocurren en Code.gs.
   ===================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PERIODOS = ['1er Periodo', '2do Periodo', '3er Periodo', '4to Periodo'];
/* Menú: [vista, icono, texto, permiso requerido]. Solo es presentación: el servidor vuelve a validar cada permiso. */
const MENU = [['inicio', '🏠', 'Inicio', null], ['calif', '✏️', 'Calificaciones', 'calificaciones.ver'], ['est', '👥', 'Estudiantes', 'estudiantes.ver'], ['consulta', '🔎', 'Consulta', 'estudiantes.ver'], ['rep', '📄', 'Reportes', 'reportes.ver'], ['obs', '📝', 'Observaciones', 'observaciones.ver'],
  ['sep', '', 'ADMINISTRACIÓN', null], ['cursos', '🏫', 'Cursos y secciones', 'cursos.ver'], ['docentes', '🧑‍🏫', 'Docentes', 'docentes.ver'], ['asignaturas', '📚', 'Asignaturas', 'asignaturas.ver'],
  ['competencias', '🧩', 'Competencias', 'asignaturas.ver'], ['asig', '🔗', 'Asignación docente', 'asignaciones.ver'], ['tutorias', '🎓', 'Tutorías', 'tutorias.ver'], ['periodos', '🗓️', 'Períodos', 'periodos.ver'],
  ['usuarios', '🔐', 'Usuarios', 'usuarios.ver'], ['roles', '🛡️', 'Roles y permisos', 'roles.ver'], ['hist', '🕘', 'Historial', 'historial.ver'], ['cfg', '⚙️', 'Configuración', 'configuracion.administrar']];
const CRUDS = ['cursos', 'docentes', 'asignaturas', 'competencias', 'asignaciones', 'tutorias', 'periodos', 'usuarios'];

const S = { boot: null, ano: '', view: 'inicio', curso: '', asig: '', modo: 'periodo', per: 1, grid: null, asigs: [], dirty: {}, errors: {}, filtro: '', orden: 'num', soloPend: false, nCall: 0, guardando: false, ultimoGuardado: '', token: '' };

/* ---------- servidor ---------- */
function call(fn, arg, silent) {
  if (!silent) loading(true);
  return new Promise(res => {
    const done = r => {
      if (!silent) loading(false);
      r = r || { ok: false, error: 'Sin respuesta del servidor.' };
      if (r.codigo === 'SESION' && S.boot) muestraLogin('Su sesión expiró. Inicie sesión de nuevo; sus datos sin guardar se conservan.');
      res(r);
    };
    try {
      google.script.run.withSuccessHandler(done).withFailureHandler(() => done({ ok: false, error: 'No se pudo conectar con el servidor. Verifique su conexión e inténtelo nuevamente.' }))
        .apiEjecutar(fn, S.token, arg === undefined ? {} : arg);
    } catch (e) { done({ ok: false, error: 'No se pudo conectar con el servidor.' }); }
  });
}
function loading(on, txt) { S.nCall += on ? 1 : -1; if (S.nCall < 0) S.nCall = 0; $('#loadTxt').textContent = txt || 'Cargando…'; $('#loading').classList.toggle('hidden', S.nCall === 0); }
let tt;
function toast(msg, tipo) { const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (tipo || ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 3800); }
function modal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.remove('hidden'); }
function closeModal() { $('#modalBg').classList.add('hidden'); }

/* ---------- utilidades de presentación ---------- */
const cursoObj = () => ({ idSeccion: S.curso });
const cursoTxt = c => c.grado + ' ' + c.seccion;
const v0 = v => (v === null || v === undefined || v === '') ? '' : v;
const f1 = v => (v === null || v === undefined || v === '') ? '' : Number(v).toFixed(1);           // 1 decimal (valor ya truncado por el servidor)
const t1 = v => (v === null || v === undefined) ? '' : (Math.floor(Number(v) * 10 + 1e-9) / 10).toFixed(1);   // truncado solo para MOSTRAR
const fn = v => { if (v === null || v === undefined || v === '') return ''; const n = Number(v); return Number.isInteger(n) ? String(n) : (Math.round(n * 10) / 10).toString(); };
const low = v => (typeof v === 'number' && v < S.boot.config.min) ? 'low' : '';
function chipClase(e) { e = e || ''; if (/NO LOGRADO|REPITENTE/.test(e)) return 'bad'; if (/^LOGRADO|^COMPLETADO|^PROMOVIDO/.test(e)) return 'ok'; if (/RECUPERACI/.test(e)) return 'warn'; if (/PENDIENTE/.test(e)) return 'info'; return 'mut'; }
const chip = e => '<span class="chip ' + chipClase(e) + '">' + esc(e) + '</span>';
const cursoSelect = (id, val) => '<label>Curso<select id="' + id + '">' + S.boot.cursos.map(c => '<option value="' + esc(c.id) + '"' + (c.id === val ? ' selected' : '') + '>' + esc(cursoTxt(c)) + '</option>').join('') + '</select></label>';
const can = p => S.boot.permisos.includes(p);
const esAdmin = () => can('estudiantes.editar');
const hoy = () => new Date().toLocaleDateString('es-DO');
function guardaSalida() { return Object.keys(S.dirty).length === 0 || confirm('Tiene cambios sin guardar. ¿Desea descartarlos?'); }

/* ---------- arranque ---------- */
async function init() {
  try { S.token = sessionStorage.getItem('sga_tk') || ''; } catch (e) { S.token = ''; }
  if (S.token) { const r = await call('sesion.bootstrap', undefined, true); if (r.ok) return arranca(r.data); S.token = ''; }
  muestraLogin();
}
function muestraLogin(msg) {
  $('#loading').classList.add('hidden'); $('#login').classList.remove('hidden');
  const m = $('#lMsg'); m.textContent = msg || ''; m.classList.toggle('hidden', !msg);
  $('#lPass').value = ''; setTimeout(() => ($('#lUser').value ? $('#lPass') : $('#lUser')).focus(), 50);
}
async function entrar() {
  const u = $('#lUser').value, c = $('#lPass').value; if (!u || !c) return;
  $('#lGo').disabled = true;
  const r = await new Promise(res => { try { google.script.run.withSuccessHandler(res).withFailureHandler(() => res({ ok: false, error: 'No se pudo conectar con el servidor.' })).apiLogin(u, c); } catch (e) { res({ ok: false, error: 'No se pudo conectar con el servidor.' }); } });
  $('#lGo').disabled = false;
  if (!r.ok) { muestraLogin(r.error); return; }
  S.token = r.data.token; try { sessionStorage.setItem('sga_tk', S.token); } catch (e) { /* sin almacenamiento */ }
  $('#login').classList.add('hidden');
  if (S.boot && S.boot.usuario.usuario === r.data.boot.usuario.usuario) { toast('Sesión renovada. Ya puede guardar de nuevo.', 'ok'); if (r.data.boot.usuario.debeCambiar) modalClave(true); return; }
  S.dirty = {}; arranca(r.data.boot);
}
async function salir() {
  if (!guardaSalida()) return;
  await call('sesion.cerrar', undefined, true);
  try { sessionStorage.removeItem('sga_tk'); } catch (e) { /* */ }
  location.reload();
}
let _eventos = false;
function arranca(boot) {
  S.boot = boot; S.ano = boot.config.ano;
  S.curso = boot.cursos.length ? boot.cursos[0].id : '';
  $('#loading').classList.add('hidden'); $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('.brand').title = boot.app; $('.brand').setAttribute('aria-label', boot.app);   // la marca ahora es el logo (CSS); aquí solo se mantiene el nombre accesible
  $('#anoSel').innerHTML = boot.anos.map(a => '<option' + (a === S.ano ? ' selected' : '') + '>' + esc(a) + '</option>').join('');
  $('#anoSel').onchange = async e => { if (!guardaSalida()) { e.target.value = S.ano; return; } S.ano = e.target.value; S.dirty = {}; await recargaCursos(); go(S.view); };
  $('#userBox').innerHTML = esc(boot.usuario.nombre) + '<br><b>' + esc(boot.usuario.rol) + '</b> <a id="uPass">PIN</a> · <a id="uOut">Salir</a>';
  $('#uPass').onclick = () => modalClave(false); $('#uOut').onclick = salir;
  const hayAdmin = MENU.some(n => n[0] !== 'sep' && n[0] !== 'inicio' && !['calif', 'est', 'consulta', 'rep', 'obs'].includes(n[0]) && (!n[3] || can(n[3])));
  $('#nav').innerHTML = MENU.filter(n => n[0] === 'sep' ? hayAdmin : (!n[3] || can(n[3]))).map(n => n[0] === 'sep' ? '<div class="sep">' + n[2] + '</div>' : '<button data-v="' + n[0] + '"><span>' + n[1] + '</span>' + n[2] + '</button>').join('');
  $('#nav').onclick = e => { const b = e.target.closest('button'); if (b) { go(b.dataset.v); $('#nav').classList.remove('open'); } };
  $('#menuBtn').onclick = () => $('#nav').classList.toggle('open');
  if (!_eventos) {
    _eventos = true;
    window.addEventListener('beforeunload', e => { if (Object.keys(S.dirty).length) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.view === 'calif') { e.preventDefault(); guardar(); } });
  }
  S.view = 'inicio';
  if (boot.usuario.debeCambiar) { modalClave(true); return; }
  go('inicio');
}
async function recargaCursos() {
  const r = await call('cursos.listarLigero', { ano: S.ano });
  S.boot.cursos = r.ok ? r.data : [];
  if (!S.boot.cursos.some(c => c.id === S.curso)) S.curso = S.boot.cursos.length ? S.boot.cursos[0].id : '';
}
function modalClave(obligatorio) {
  modal('<h3>Cambiar mi PIN</h3><label>PIN actual</label><input type="password" id="pA" inputmode="numeric" maxlength="4" autocomplete="current-password"><label>PIN nuevo (4 dígitos)</label><input type="password" id="pN" inputmode="numeric" maxlength="4" autocomplete="new-password"><label>Repita el PIN nuevo</label><input type="password" id="pR" inputmode="numeric" maxlength="4" autocomplete="new-password">' +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="pOk">Guardar</button></div>');
  $('#pOk').onclick = async () => {
    if ($('#pN').value !== $('#pR').value) return toast('Los PIN nuevos no coinciden.', 'bad');
    const r = await call('sesion.cambiarClave', { actual: $('#pA').value, nueva: $('#pN').value });
    if (!r.ok) return toast(r.error, 'bad');
    closeModal(); toast('PIN actualizado.', 'ok');
  };
}
function go(v) {
  if (v !== S.view && !guardaSalida()) return;
  if (v !== S.view) S.dirty = {};
  S.view = v; S.errors = {};
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (CRUDS.includes(v)) vCrud(v); else ({ inicio: vInicio, calif: vCalif, est: vEst, consulta: vConsulta, rep: vRep, cfg: vCfg, roles: vRoles, hist: vHist, asig: vAsig, obs: vObs })[v]();
  window.scrollTo(0, 0);
}
function sinCursos() { $('#main').innerHTML = '<div class="card empty">No tiene cursos disponibles en este año escolar. El administrador puede crearlos en Administración > Cursos y secciones, y asignarle docentes.</div>'; }

/* =====================================================================
   INICIO (dashboard)
   ===================================================================== */
async function vInicio() {
  if (!S.curso) return sinCursos();
  $('#main').innerHTML = '<h2>Inicio</h2><div class="bar">' + cursoSelect('dCurso', S.curso) +
    '<label>Período a analizar<div class="seg" id="dPer">' + [1, 2, 3, 4].map(p => '<button data-p="' + p + '"' + (p === S.per ? ' class="on"' : '') + '>P' + p + '</button>').join('') + '</div></label></div><div id="dBody"></div>';
  $('#dCurso').onchange = e => { S.curso = e.target.value; cargaDash(); };
  $('#dPer').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.per = +b.dataset.p; $$('#dPer button').forEach(x => x.classList.toggle('on', x === b)); cargaDash(); };
  cargaDash();
}
async function cargaDash() {
  const c = cursoObj();
  const r = await call('reportes.dashboard', { ano: S.ano, idSeccion: c.idSeccion, periodo: S.per });
  if (S.view !== 'inicio') return;
  const el = $('#dBody');
  if (!r.ok) { el.innerHTML = '<div class="msg bad">' + esc(r.error) + '</div>'; return; }
  const d = r.data, min = d.min;
  const pc = d.porcentajeAprobando === null ? '–' : Math.round(d.porcentajeAprobando * 100) + '%';
  const maxDist = Math.max(1, ...d.distribucion);
  const rangos = ['Menos de ' + min, min + ' – 79', '80 – 89', '90 – 100'];
  el.innerHTML = '<div class="kpis">' +
    kpi(d.totalEstudiantes, 'Estudiantes') + kpi(d.promedioGeneral === null ? '–' : t1(d.promedioGeneral), 'Promedio general P' + d.periodo) +
    kpi(pc, '% con promedio ≥ ' + min, 'ok') + kpi(d.enRiesgo.length, 'En riesgo (alguna asignatura < ' + min + ')', d.enRiesgo.length ? 'bad' : '') +
    kpi(d.estudiantesPendientes, 'Con calificaciones pendientes', d.estudiantesPendientes ? 'warn' : '') + kpi(d.estudiantesEnRecuperacion, 'Con recuperación pendiente', d.estudiantesEnRecuperacion ? 'warn' : '') +
    '</div><div class="kpis">' + kpi(d.estudiantesCompletiva, 'En completiva') + kpi(d.estudiantesExtraordinaria, 'En extraordinaria') + kpi(d.estudiantesEspecial, 'En evaluación especial') +
    kpi(d.situacion.PROMOVIDO, 'Promovidos', 'ok') + kpi(d.situacion.REPITENTE, 'Repitentes', d.situacion.REPITENTE ? 'bad' : '') + '</div>' +
    '<div class="card"><h3 style="margin-top:0">Promedio por asignatura y período</h3><div class="tw" style="max-height:none"><table class="t"><thead><tr><th class="l">Asignatura</th>' + [1, 2, 3, 4].map(p => '<th>P' + p + '</th>').join('') + '</tr></thead><tbody>' +
    d.porAsignatura.map(a => '<tr><td class="l">' + esc(a.nombre) + '</td>' + a.periodos.map(v => '<td class="' + low(v) + '">' + (v === null ? '' : t1(v)) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div></div>' +
    '<div class="two"><div class="card bars"><h3 style="margin-top:0">Distribución de promedios (P' + d.periodo + ')</h3>' +
    d.distribucion.map((n, i) => '<div class="row"><span class="lb">' + rangos[i] + '</span><div class="bg"><div class="fg" style="width:' + (n / maxDist * 100) + '%;' + (i === 0 ? 'background:var(--bad)' : '') + '"></div></div><b>' + n + '</b></div>').join('') + '</div>' +
    '<div class="card"><h3 style="margin-top:0">Cuadro de honor (Top 5)</h3>' + (d.mejor.length ? '<ul class="list">' + d.mejor.map((m, i) => '<li><span>' + (i + 1) + '. ' + esc(m.nombre) + '</span><b>' + t1(m.promedio) + '</b></li>').join('') + '</ul>' : '<div class="empty">Sin datos todavía</div>') + '</div></div>' +
    '<div class="card"><h3 style="margin-top:0">Estudiantes en riesgo (P' + d.periodo + ')</h3>' + (d.enRiesgo.length ? '<ul class="list">' + d.enRiesgo.map(m => '<li><span>' + esc(m.nombre) + '</span><span style="color:var(--bad);text-align:right">' + esc(m.riesgo.join(', ')) + '</span></li>').join('') + '</ul>' : '<div class="empty">Ningún estudiante en riesgo en este período 🎉</div>') + '</div>';
}
const kpi = (v, l, c) => '<div class="kpi ' + (c || '') + '"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>';

/* =====================================================================
   CALIFICACIONES
   ===================================================================== */
async function vCalif() {
  if (!S.curso) return sinCursos();
  $('#main').innerHTML = '<h2>Calificaciones</h2><div class="card no-print"><div class="bar">' + cursoSelect('cCurso', S.curso) +
    '<label>Asignatura<select id="cAsig"></select></label>' +
    '<label>Vista<div class="seg" id="cModo"><button data-m="periodo">Períodos</button><button data-m="final">Resultados y evaluaciones finales</button><button data-m="asist">Asistencia</button></div></label>' +
    '<label id="cPerBox">Período<div class="seg" id="cPer">' + [1, 2, 3, 4].map(p => '<button data-p="' + p + '">P' + p + '</button>').join('') + '</div></label></div>' +
    '<div class="bar"><label>Buscar estudiante<input type="search" id="cBuscar" placeholder="Nombre…"></label>' +
    '<label>Filtro<select id="cFiltro"><option value="">Todos</option><option value="pend">Con RP pendiente / incompletos</option></select></label>' +
    '<label>Orden<select id="cOrden"><option value="num">Número de lista</option><option value="nom">Nombre (A-Z)</option></select></label>' +
    '<div class="grow"></div><span class="status" id="cStatus"></span><button class="btn ok" id="cGuardar" disabled>Guardar (Ctrl+S)</button></div></div>' +
    '<div id="cGrid"></div><div class="status no-print" style="margin-top:8px">Atajos: <b>Enter</b>/<b>↓</b> baja · <b>Shift+Enter</b>/<b>↑</b> sube · <b>Tab</b> avanza · <b>Ctrl+S</b> guarda. La RP se habilita sola cuando la nota es menor de ' + S.boot.config.min + '.</div>';
  $('#cCurso').onchange = async e => { if (!guardaSalida()) { e.target.value = S.curso; return; } S.curso = e.target.value; S.dirty = {}; S.asig = ''; await cargaAsigs(); };
  $('#cAsig').onchange = e => { if (!guardaSalida()) { e.target.value = S.asig; return; } S.asig = e.target.value; S.dirty = {}; cargaGrid(); };
  $('#cModo').onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.m === S.modo) return; if (!guardaSalida()) return; S.modo = b.dataset.m; S.dirty = {}; marcaModo(); cargaGrid(); };
  $('#cPer').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (!guardaSalida()) return; S.per = +b.dataset.p; S.dirty = {}; marcaModo(); pintaGrid(); };
  $('#cBuscar').oninput = e => { S.filtro = e.target.value; pintaGrid(); };
  $('#cFiltro').onchange = e => { S.soloPend = e.target.value === 'pend'; pintaGrid(); };
  $('#cOrden').onchange = e => { S.orden = e.target.value; pintaGrid(); };
  $('#cGuardar').onclick = guardar;
  marcaModo();
  await cargaAsigs();
}
function marcaModo() {
  $$('#cModo button').forEach(b => b.classList.toggle('on', b.dataset.m === S.modo));
  $$('#cPer button').forEach(b => b.classList.toggle('on', +b.dataset.p === S.per));
  $('#cPerBox').classList.toggle('hidden', S.modo !== 'periodo');
}
async function cargaAsigs() {
  const c = cursoObj();
  const r = await call('cursos.asignaturas', { ano: S.ano, idSeccion: c.idSeccion });
  if (!r.ok) { $('#cGrid').innerHTML = '<div class="msg bad">' + esc(r.error) + '</div>'; return; }
  S.asigs = r.data;
  if (!S.asigs.some(a => a.id === S.asig)) { const first = S.asigs.find(a => a.puedeEditar) || S.asigs[0]; S.asig = first ? first.id : ''; }
  $('#cAsig').innerHTML = S.asigs.map(a => '<option value="' + esc(a.id) + '"' + (a.id === S.asig ? ' selected' : '') + '>' + esc(a.nombre) + (a.puedeEditar ? '' : ' 🔒') + '</option>').join('');
  cargaGrid();
}
async function cargaGrid(conservar) {
  if (!S.asig) { $('#cGrid').innerHTML = '<div class="card empty">Este curso no tiene asignaturas disponibles.</div>'; return; }
  const c = cursoObj();
  const p = { ano: S.ano, idSeccion: c.idSeccion, idAsignatura: S.asig };
  const r = await call(S.modo === 'asist' ? 'asistencia.obtener' : 'calificaciones.grid', p);
  if (S.view !== 'calif') return;
  if (!r.ok) { $('#cGrid').innerHTML = '<div class="msg bad">' + esc(r.error) + '</div>'; return; }
  S.grid = r.data;
  if (!conservar) S.errors = {};
  pintaGrid();
}
function filasVisibles() {
  const g = S.grid; if (!g) return [];
  let f = g.estudiantes.slice();
  const q = S.filtro.trim().toLowerCase();
  if (q) f = f.filter(e => e.nombre.toLowerCase().includes(q));
  if (S.soloPend && S.modo !== 'asist') f = f.filter(e => { const c = e.calc; return S.modo === 'periodo' ? c.periodos[S.per - 1].estado !== 'COMPLETADO' : !/^LOGRADO|NO LOGRADO/.test(c.estado); });
  if (S.orden === 'nom') f.sort((a, b) => a.nombre.localeCompare(b.nombre)); else f.sort((a, b) => a.num - b.num);
  return f;
}
const dv = (id, k) => (S.dirty[id] && k in S.dirty[id]) ? S.dirty[id][k] : null;
function valor(e, k) { const d = dv(e.idEstudiante, k); if (d !== null) return d; const src = S.modo === 'asist' ? e.meses : e.notas; const v = src[k]; return v === null || v === undefined ? '' : v; }

function pintaGrid() {
  const g = S.grid; if (!g) return;
  const box = $('#cGrid');
  const rows = filasVisibles();
  let aviso = '';
  if (!g.puedeEditar) aviso = '<div class="msg info no-print">Solo lectura: no tiene permiso para modificar ' + esc(g.asignatura.nombre) + ' en este curso.</div>';
  else if (g.docente) aviso = '';
  if (S.modo === 'periodo' && g.cerrados && g.cerrados[S.per]) aviso += '<div class="msg info no-print">El período P' + S.per + ' está cerrado: solo lectura.</div>';
  const info = '<div class="status" style="margin-bottom:6px"><b>' + esc(g.asignatura.nombre) + '</b>' + (g.docente ? ' · Docente: ' + esc(g.docente) : '') + ' · ' + g.estudiantes.length + ' estudiantes</div>';
  if (!rows.length) { box.innerHTML = aviso + info + '<div class="card empty">No hay estudiantes para mostrar.</div>'; return actualizaEstado(); }
  let html;
  if (S.modo === 'periodo') html = tablaPeriodo(g, rows);
  else if (S.modo === 'final') html = tablaFinal(g, rows);
  else html = tablaAsist(g, rows);
  box.innerHTML = aviso + info + '<div class="tw">' + html + '</div>';
  validaTodo();
  actualizaEstado();
}
function inp(e, k, col, dis, extra) {
  return '<input class="nota ' + (extra || '') + '" data-id="' + esc(e.idEstudiante) + '" data-k="' + k + '" data-c="' + col + '" inputmode="numeric" autocomplete="off" maxlength="5" value="' + esc(valor(e, k)) + '"' + (dis ? ' disabled' : '') + '>';
}
function tablaPeriodo(g, rows) {
  const p = S.per, min = g.params.min, ed = g.puedeEditar && !(g.cerrados && g.cerrados[S.per]);
  let h = '<table class="t"><thead><tr><th rowspan="2" class="sticky1">No.</th><th rowspan="2" class="l sticky2">Estudiante</th>' +

/* ---- validación visual inmediata (la definitiva la hace el servidor) ---- */
function mensajeCelda(el) {
  const k = el.dataset.k, id = el.dataset.id, raw = el.value.trim().replace(',', '.');
  if (raw === '') return '';
  const cfg = S.boot.config, g = S.grid;
  const n = Number(raw);
  const rango = S.modo === 'asist' ? 'Debe introducir un porcentaje entre 0 y 100.' : 'Debe introducir una calificación entre 0 y ' + cfg.max + '.';
  if (!/^\d+(\.\d+)?$/.test(raw) || isNaN(n) || n < 0 || n > cfg.max) return rango;
  if (cfg.entera && S.modo !== 'asist' && !Number.isInteger(n)) return 'La calificación debe ser un número entero.';
  const m = /^R(\d)C(\d)$/.exec(k);
  if (m && S.modo === 'periodo') {
    const e = g.estudiantes.find(x => x.idEstudiante === id), pv = parseFloat(String(valor(e, 'P' + m[1] + 'C' + m[2])).replace(',', '.'));
    if (isNaN(pv)) return 'Registre primero la nota original.';
    if (n < pv) return 'La recuperación no puede ser menor que la nota original (' + pv + ').';
  }
  return '';
}
function validaTodo() {
  $$('#cGrid input.nota').forEach(el => {
    const m = mensajeCelda(el), srv = S.errors[el.dataset.id + '|' + el.dataset.k];
    el.classList.toggle('bad', !!(m || srv)); el.title = m || srv || '';
    const k = el.dataset.k, e = S.grid.estudiantes.find(x => x.idEstudiante === el.dataset.id);
    const guardada = S.modo === 'asist' ? e.meses[k] : e.notas[k];
    el.classList.toggle('dirty', !!S.dirty[el.dataset.id] && k in S.dirty[el.dataset.id] && norm(el.value) !== norm(guardada));
    if (/^P\dC\d$/.test(k)) { const x = parseFloat(el.value.replace(',', '.')); el.classList.toggle('low', !isNaN(x) && x < S.boot.config.min); }
  });
}
const norm = v => (v === null || v === undefined) ? '' : String(v).trim().replace(',', '.');

$('#main').addEventListener('input', ev => {
  const el = ev.target; if (!el.matches || !el.matches('input.nota')) return;
  const id = el.dataset.id, k = el.dataset.k, g = S.grid, e = g.estudiantes.find(x => x.idEstudiante === id);
  const guardada = S.modo === 'asist' ? e.meses[k] : e.notas[k];
  const setDirty = (kk, val, base) => { S.dirty[id] = S.dirty[id] || {}; if (norm(val) === norm(base)) delete S.dirty[id][kk]; else S.dirty[id][kk] = val.trim(); if (!Object.keys(S.dirty[id]).length) delete S.dirty[id]; };
  setDirty(k, el.value, guardada);
  delete S.errors[id + '|' + k];
  // La RP depende de P: se habilita/deshabilita sola
  const m = /^P(\d)C(\d)$/.exec(k);
  if (m && S.modo === 'periodo') {
    const rk = 'R' + m[1] + 'C' + m[2], rel = $('input[data-id="' + id + '"][data-k="' + rk + '"]');
    const pv = parseFloat(el.value.replace(',', '.')), ok = g.puedeEditar && g.params.usaRec && !isNaN(pv) && pv < S.boot.config.min && !mensajeCelda(el);
    if (rel) { rel.disabled = !ok; if (!ok && rel.value !== '') { rel.value = ''; setDirty(rk, '', e.notas[rk]); } }
  }
  validaTodo();
  const tr = el.closest('tr'); const es = tr && tr.querySelector('td.es'); if (es) es.innerHTML = S.dirty[id] ? '<span class="chip warn">● Sin guardar</span>' : chip(S.modo === 'periodo' ? e.calc.periodos[S.per - 1].estado : e.calc.estado);
  actualizaEstado();
});
$('#main').addEventListener('keydown', ev => {
  const el = ev.target; if (!el.matches || !el.matches('input.nota')) return;
  const k = ev.key; if (!['Enter', 'ArrowDown', 'ArrowUp'].includes(k)) return;
  ev.preventDefault();
  const up = k === 'ArrowUp' || (k === 'Enter' && ev.shiftKey);
  const col = $$('#cGrid input.nota[data-c="' + el.dataset.c + '"]:not([disabled])'), i = col.indexOf(el);
  let nx = col[i + (up ? -1 : 1)];
  if (!nx && !up) { const cols = [...new Set($$('#cGrid input.nota:not([disabled])').map(x => +x.dataset.c))].sort((a, b) => a - b); const sig = cols.find(c => c > +el.dataset.c); if (sig !== undefined) nx = $('#cGrid input.nota[data-c="' + sig + '"]:not([disabled])'); }
  if (nx) { nx.focus(); nx.select(); }
});
$('#main').addEventListener('focusin', ev => { if (ev.target.matches && ev.target.matches('input.nota')) ev.target.select(); });

function actualizaEstado() {
  const n = Object.values(S.dirty).reduce((a, o) => a + Object.keys(o).length, 0);
  const st = $('#cStatus'), bt = $('#cGuardar'); if (!st) return;
  const hayMalas = $$('#cGrid input.nota.bad').length > 0;
  if (S.guardando) { st.className = 'status'; st.textContent = 'Guardando…'; bt.disabled = true; return; }
  if (n) { st.className = 'status dirty'; st.textContent = '● ' + n + ' cambio(s) sin guardar' + (hayMalas ? ' · corrija las celdas en rojo' : ''); }
  else { st.className = 'status' + (S.ultimoGuardado ? ' saved' : ''); st.textContent = S.ultimoGuardado ? '✔ Guardado ' + S.ultimoGuardado : ''; }
  bt.disabled = !n || !S.grid || !S.grid.puedeEditar;
}
async function guardar() {
  if (S.guardando || !S.grid) return;
  const filas = Object.entries(S.dirty).map(([id, cambios]) => ({ idEstudiante: id, cambios }));
  if (!filas.length) return;
  if ($$('#cGrid input.nota.bad').length) { toast('Corrija las celdas marcadas en rojo antes de guardar.', 'bad'); return; }
  S.guardando = true; actualizaEstado();
  const c = cursoObj();
  const r = await call(S.modo === 'asist' ? 'asistencia.guardar' : 'calificaciones.guardar', { ano: S.ano, idSeccion: c.idSeccion, idAsignatura: S.asig, filas }, true);
  S.guardando = false;
  if (!r.ok) { toast(r.error, 'bad'); actualizaEstado(); const st = $('#cStatus'); if (st) { st.className = 'status err'; st.textContent = 'No se pudo guardar. Sus datos siguen en pantalla.'; } return; }
  const errIds = new Set(r.data.errores.map(x => x.idEstudiante));
  r.data.errores.forEach(x => { S.errors[x.idEstudiante + '|' + x.campo] = x.mensaje; });
  filas.forEach(f => { if (!errIds.has(f.idEstudiante)) delete S.dirty[f.idEstudiante]; });
  S.ultimoGuardado = new Date().toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' });
  await cargaGrid(true);
  if (r.data.errores.length) { toast(r.data.guardados + ' fila(s) guardadas. ' + r.data.errores.length + ' rechazada(s): ' + r.data.errores[0].mensaje, 'bad'); }
  else toast(r.data.guardados + ' fila(s) guardada(s) correctamente.', 'ok');
}

/* ---- Descarga directa en PDF: convierte cada hoja del reporte en una página Carta horizontal ---- */
const cargaScript = url => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => ko(new Error('no se pudo cargar ' + url)); document.head.appendChild(s); });
async function descargarPDF() {
  const btn = $('#rPdf'), pgs = [...document.querySelectorAll('#rOut .pg')];
  if (!pgs.length) { toast('Primero genere el reporte', 'bad'); return; }
  const txt = btn.textContent; btn.disabled = true;
  try {
    toast('Preparando PDF…');
    if (!window.html2canvas) await cargaScript(IMP.pdf.urlHtml2canvas);          // las librerías se cargan solo al usar el botón
    if (!(window.jspdf && window.jspdf.jsPDF)) await cargaScript(IMP.pdf.urlJsPDF);
    const M = IMP.pdf.margen, W = 11 - 2 * M, H = 8.5 - 2 * M;                   // área útil de la hoja Carta horizontal (pulgadas)
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'in', format: 'letter', compress: true });
    let primera = true;
    const poner = cv => {                                                         // agrega una imagen como página del PDF
      if (!primera) pdf.addPage(); primera = false;
      pdf.addImage(cv.toDataURL('image/jpeg', IMP.pdf.calidadJpg), 'JPEG', M, M, W, W * cv.height / cv.width);
    };
    window.scrollTo(0, 0);
    for (let i = 0; i < pgs.length; i++) {
      btn.textContent = 'Generando ' + (i + 1) + '/' + pgs.length + '…';
      await new Promise(r => setTimeout(r, 30));                                  // deja respirar a la pantalla
      const el = pgs[i], fija = /\b(ent|bol|bf|por)\b/.test(el.className), ov = el.style.overflow;
      if (!fija) el.style.overflow = 'visible';
      const cv = await html2canvas(el, { scale: IMP.pdf.escala, backgroundColor: '#fff', useCORS: true, logging: false, scrollX: 0, scrollY: 0, width: fija ? el.offsetWidth : el.scrollWidth });
      el.style.overflow = ov;
      const alto = W * cv.height / cv.width;
      if (alto <= H + 0.02) poner(cv);                                            // hojas fijas (P1–P3, boletín): 1 hoja = 1 página
      else {                                                                      // reportes largos (registro, situación…): se parten en varias páginas
        const px = Math.floor(cv.width * H / W);
        for (let y = 0; y < cv.height; y += px) {
          const hh = Math.min(px, cv.height - y), c2 = document.createElement('canvas');
          c2.width = cv.width; c2.height = hh; c2.getContext('2d').drawImage(cv, 0, y, cv.width, hh, 0, 0, cv.width, hh); poner(c2);
        }
      }
    }
    const d = S.repData, nombre = IMP.pdf.nombre($('#rTipo').value, $('#rPer').value, d).replace(/[^\w\-]+/g, '_') + '.pdf';
    pdf.save(nombre);
    toast('PDF descargado: ' + nombre, 'ok');
  } catch (err) {
    toast('No se pudo crear el PDF (' + err.message + '). Verifique su conexión a internet e inténtelo de nuevo.', 'bad');
  } finally { btn.textContent = txt; btn.disabled = false; }
}

function ajustaRep() {
  const t = $('#rTipo').value;
  $('#rPerBox').classList.toggle('hidden', !(t === 'entrega' || t === 'registro' || t === 'pend'));
  $('#rAsigBox').classList.toggle('hidden', t !== 'registro');
  $('#rEstBox').classList.toggle('hidden', !(t === 'boletin' || t === 'entrega'));
  $('#rPortBox').classList.toggle('hidden', t !== 'boletin');
  const sel = $('#rPer'), actual = sel.value;
  const ops = t === 'entrega' ? [1, 2, 3] : [1, 2, 3, 4];
  sel.innerHTML = (t === 'registro' ? '<option value="0">Todos</option>' : '') + ops.map(p => '<option value="' + p + '">P' + p + '</option>').join('');
  if ([...sel.options].some(o => o.value === actual)) sel.value = actual;
}

async function generaRep(preId) {
  const d = await cargaDatosCurso(); if (!d) return;
  const t = $('#rTipo').value;
  // selectores dependientes de los datos
  const selA = $('#rAsig'), selE = $('#rEst'), aPrev = selA.value, ePrev = selE.value;
  selA.innerHTML = d.asignaturas.map(a => '<option value="' + esc(a.id) + '">' + esc(a.nombre) + '</option>').join(''); if (aPrev) selA.value = aPrev;

/* ---- Pendientes y recuperaciones ---- */
function repPend(d, per) {
  const min = d.min; let rec = [], falt = [];
  d.estudiantes.forEach(e => d.asignaturas.forEach(a => {
    const x = e.registros[a.id], n = x.notas, pr = x.calc.periodos[per - 1];
    a.competencias.forEach((c, i) => {
      const p = n['P' + per + 'C' + (i + 1)], r = n['R' + per + 'C' + (i + 1)];
      if (p !== null && p < min) rec.push([e.num, e.nombre, a.nombre, c.abrev, p, r === null ? '' : r, r === null ? 'RP PENDIENTE' : (r >= min ? 'RECUPERADA' : 'RP < ' + min)]);
    });
    if (pr.ingresadas < 4) falt.push([e.num, e.nombre, a.nombre, pr.ingresadas + ' de 4 notas']);
  }));
  const tabla = (cols, rows) => rows.length ? '<table class="rt"><thead><tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((v, i) => '<td class="' + (i === 1 || i === 2 ? 'l' : '') + '">' + esc(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' : '<p>✔ Sin registros.</p>';
  return '<div class="pg">' + cab(d, 'RECUPERACIONES Y NOTAS PENDIENTES – P' + per + ' · ' + esc(d.grado + ' ' + d.seccion)) + '<h3>Notas menores de ' + min + ' (recuperación)</h3>' + tabla(['No.', 'Estudiante', 'Asignatura', 'Comp.', 'P' + per, 'RP' + per, 'Estado'], rec) +
    '<h3>Notas por registrar</h3>' + tabla(['No.', 'Estudiante', 'Asignatura', 'Registradas'], falt) + '</div>';
}

/* ---- Situación final del curso ---- */
function repSituacion(d) {
  const as = asigsOrden(d);
  let h = '<div class="pg">' + cab(d, 'SITUACIÓN FINAL – ' + esc(d.grado + ' ' + d.seccion)) + '<table class="rt sm"><thead><tr><th>No.</th><th class="l">Estudiante</th>' + as.map(a => '<th title="' + esc(a.nombre) + '">' + esc(a.abrev) + '</th>').join('') + '<th>Resultado</th></tr></thead><tbody>';
  const cnt = { PROMOVIDO: 0, REPITENTE: 0, PENDIENTE: 0 };
  d.estudiantes.forEach(e => {
    cnt[e.situacion]++;
    h += '<tr><td>' + e.num + '</td><td class="l" style="white-space:nowrap">' + esc(e.nombre) + '</td>' + as.map(a => { const c = e.registros[a.id].calc; const t = c.A !== null ? c.A + (c.etapa !== 'CF' ? ' ✓' : '') : (c.R !== null ? '<span class="low">' + c.R + ' R</span>' : '<span style="color:#888">…</span>'); return '<td>' + t + '</td>'; }).join('') + '<td><b>' + e.situacion + '</b></td></tr>';
  });
  return h + '</tbody></table><p style="font-size:11px"><b>Promovidos:</b> ' + cnt.PROMOVIDO + ' &nbsp; <b>Repitentes:</b> ' + cnt.REPITENTE + ' &nbsp; <b>Pendientes:</b> ' + cnt.PENDIENTE + ' &nbsp; (“…” = aún sin resultado final · ✓ = aprobó en una evaluación final)</p></div>';
}

    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="oOk">Guardar</button></div>');
  $('#oOk').onclick = async () => {
    const r = await call('observaciones.guardar', { id: edita ? x.id : '', ano: S.ano, idSeccion: S.curso, idEstudiante: $('#oFE').value, tipo: $('#oFT').value, fecha: $('#oFF').value, idAsignatura: $('#oFA').value, idPeriodo: $('#oFP').value, texto: $('#oFX').value });
    if (!r.ok) return toast(r.error, 'bad');
    closeModal(); toast('Observación guardada.', 'ok'); cargaObs();
  };
}

/* =====================================================================
   CONFIGURACIÓN (requiere el permiso configuracion.administrar)
   ===================================================================== */
async function vCfg() {
  const r = await call('config.obtener');
  if (!r.ok) { $('#main').innerHTML = '<h2>Configuración</h2><div class="msg bad">' + esc(r.error) + '</div>'; return; }
  S.cfgItems = r.data;
  $('#main').innerHTML = '<h2>Configuración</h2><div class="msg info">Estos parámetros controlan las reglas de calificación y la seguridad. Al cambiar uno, todos los resultados se recalculan. Haga un respaldo antes (menú SGA de la hoja).</div>' +
    '<div class="card"><div class="tw" style="max-height:none"><table class="t"><thead><tr><th class="l">Parámetro</th><th>Valor</th><th class="l">Descripción</th></tr></thead><tbody>' +
    r.data.map((x, i) => '<tr><td class="l"><b>' + esc(x.clave) + '</b></td><td><input class="cf" data-i="' + i + '" value="' + esc(x.valor) + '" style="width:210px;padding:6px;border:1px solid var(--line);border-radius:6px"></td><td class="l" style="white-space:normal">' + esc(x.descripcion) + '</td></tr>').join('') +
    '</tbody></table></div><div style="margin-top:12px"><button class="btn ok" id="cfgGuardar">Guardar configuración</button></div></div>';
  $('#cfgGuardar').onclick = async () => {
    const items = $$('input.cf').map(el => ({ clave: S.cfgItems[+el.dataset.i].clave, valor: el.value }));
    const g = await call('config.guardar', { items });
    if (!g.ok) return toast(g.error, 'bad');
    toast(g.data.cambios + ' parámetro(s) actualizados. Recargue la página para aplicar la nota mínima en pantalla.', 'ok');
  };
}

/* =====================================================================
   ADMINISTRACIÓN GENÉRICA (usuarios, docentes, cursos, asignaturas, competencias, asignaciones, tutorías, períodos)
   La definición de columnas, campos y permisos viene del servidor (crud.meta): aquí solo se dibuja.
   ===================================================================== */
const pagerHtml = d => '<div class="pager"><span>' + d.total + ' registro(s) · página ' + d.pagina + ' de ' + d.paginas + '</span><button class="btn sec" data-pg="' + (d.pagina - 1) + '"' + (d.pagina <= 1 ? ' disabled' : '') + '>◀</button><button class="btn sec" data-pg="' + (d.pagina + 1) + '"' + (d.pagina >= d.paginas ? ' disabled' : '') + '>▶</button></div>';
const ESTADO_ACCION = { ACTIVO: 'Desactivar', INACTIVO: 'Activar', ACTIVA: 'Desactivar', INACTIVA: 'Activar', ABIERTO: 'Cerrar', CERRADO: 'Reabrir' };
async function vCrud(mod) {
  const m = await call('crud.meta', { modulo: mod });
  if (!m.ok) { $('#main').innerHTML = '<h2>Administración</h2><div class="msg bad">' + esc(m.error) + '</div>'; return; }
  const M = S.crud = { mod: mod, meta: m.data, pagina: 1, q: '', filtros: {}, datos: null };
  const filtrosHtml = [];
  for (const f of M.meta.filtros) {
    let ops = f.opciones ? f.opciones.map(o => ({ id: o, texto: o })) : ((await call('crud.opciones', { ref: f.ref }, true)).data || []);
    filtrosHtml.push('<label>' + esc(f.et) + '<select data-f="' + f.k + '"><option value="">Todos</option>' + ops.map(o => '<option value="' + esc(o.id) + '">' + esc(o.texto) + '</option>').join('') + '</select></label>');
  }
  const acc = M.meta.acciones.filter(a => a.global);
  $('#main').innerHTML = '<h2>' + esc(M.meta.titulo) + '</h2>' + (M.meta.ayuda ? '<div class="msg info">' + esc(M.meta.ayuda) + '</div>' : '') +
    '<div class="bar"><label>Buscar<input type="search" id="kQ" placeholder="Escriba para buscar…"></label>' +
    (M.meta.conAno ? '<label>Año escolar<select id="kAno">' + S.boot.anos.map(a => '<option' + (a === S.ano ? ' selected' : '') + '>' + esc(a) + '</option>').join('') + '</select></label>' : '') + filtrosHtml.join('') +
    '<div class="grow"></div>' + acc.map(a => '<button class="btn sec kAcc" data-a="' + a.id + '">' + esc(a.et) + '</button>').join('') + (M.meta.puedeCrear ? '<button class="btn" id="kNuevo">+ Nuevo</button>' : '') + '</div><div id="kBody"></div>';
  let tmr; $('#kQ').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { M.q = e.target.value; M.pagina = 1; cargaCrud(); }, 300); };
  $$('select[data-f]').forEach(s => s.onchange = e => { M.filtros[s.dataset.f] = s.value; M.pagina = 1; cargaCrud(); });
  if ($('#kAno')) $('#kAno').onchange = e => { M.pagina = 1; cargaCrud(); };
  if ($('#kNuevo')) $('#kNuevo').onclick = () => modalCrud(null);
  $$('.kAcc').forEach(b => b.onclick = () => accionGlobal(b.dataset.a));
  cargaCrud();
}
async function cargaCrud() {
  const M = S.crud, r = await call('crud.listar', { modulo: M.mod, q: M.q, filtros: M.filtros, pagina: M.pagina, ano: $('#kAno') ? $('#kAno').value : S.ano }, true);
  if (S.view !== M.mod) return;
  const box = $('#kBody'); if (!r.ok) { box.innerHTML = '<div class="msg bad">' + esc(r.error) + '</div>'; return; }
  M.datos = r.data;
  const mt = M.meta, idk = mt.idKey, hayAcc = mt.puedeEditar || mt.puedeEstado || mt.acciones.some(a => !a.global);
  box.innerHTML = r.data.items.length ? '<div class="tw" style="max-height:none"><table class="t"><thead><tr>' + mt.columnas.map(c => '<th class="l">' + esc(c[1]) + '</th>').join('') + (hayAcc ? '<th>Acciones</th>' : '') + '</tr></thead><tbody>' +
    r.data.items.map((o, i) => '<tr>' + mt.columnas.map(c => '<td class="l" style="white-space:normal">' + (c[0] === 'ESTADO' ? chip(o[c[0]]).replace('mut', /^(ACTIV|ABIERTO)/.test(o[c[0]]) ? 'ok' : 'bad') : esc(o[c[0]])) + '</td>').join('') +
      (hayAcc ? '<td style="white-space:nowrap">' + (mt.puedeEditar ? '<button class="btn sec sm" data-e="' + i + '">Editar</button> ' : '') +
        (mt.puedeEstado && o.ESTADO ? '<button class="btn sec sm" data-s="' + i + '">' + (ESTADO_ACCION[o.ESTADO] || 'Cambiar estado') + '</button> ' : '') +
        mt.acciones.filter(a => !a.global).map(a => '<button class="btn sec sm" data-a="' + a.id + '|' + i + '">' + esc(a.et) + '</button>').join(' ') + '</td>' : '') + '</tr>').join('') + '</tbody></table></div>' + pagerHtml(r.data) : '<div class="card empty">No hay registros.</div>';
  box.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pg) { M.pagina = +b.dataset.pg; cargaCrud(); }
    else if (b.dataset.e !== undefined) modalCrud(M.datos.items[+b.dataset.e]);
    else if (b.dataset.s !== undefined) {
      const o = M.datos.items[+b.dataset.s], est = mt.estados, nuevo = o.ESTADO === est[0] ? est[1] : est[0];
      if (!confirm((ESTADO_ACCION[o.ESTADO] || 'Cambiar estado') + ' este registro?')) return;
      const x = await call('crud.estado', { modulo: M.mod, id: o[idk], estado: nuevo }); if (!x.ok) return toast(x.error, 'bad'); toast('Estado actualizado.', 'ok'); if (M.mod === 'cursos') recargaCursos(); cargaCrud();
    } else if (b.dataset.a) {
      const [aid, i] = b.dataset.a.split('|'), o = M.datos.items[+i];
      if (aid === 'restablecer') {
        const pin = prompt('Nuevo PIN de 4 dígitos para ' + o.USUARIO + '.\nDéjelo vacío para que el sistema genere uno. Se cerrarán sus sesiones abiertas.');
        if (pin === null) return;
        const x = await call('usuarios.restablecer', { id: o[idk], pin: pin.trim() }); if (!x.ok) return toast(x.error, 'bad'); muestraClaveTemporal(x.data.usuario, x.data.claveTemporal);
      } else if (aid === 'acceso') {
        let usuario = '';
        if (!o.USUARIO_TXT) { const u = prompt('Usuario para ' + o.NOMBRE_COMPLETO + '.\nDéjelo vacío para que el sistema lo genere a partir del nombre.'); if (u === null) return; usuario = u.trim().toLowerCase(); }
        const pin = prompt('PIN de 4 dígitos' + (o.USUARIO_TXT ? ' nuevo' : '') + '.\nDéjelo vacío para que el sistema genere uno.'); if (pin === null) return;
        const x = await call('docentes.acceso', { id: o[idk], usuario, pin: pin.trim() }); if (!x.ok) return toast(x.error, 'bad');
        muestraClaveTemporal(x.data.usuario, x.data.pin); cargaCrud();
      }
    }
  };
}
async function accionGlobal(id) {
  if (id === 'duplicar') return modalDuplicarPeriodos();
  if (id !== 'accesos') return;
  if (!confirm('Se creará un usuario y un PIN para cada docente activo que todavía no tenga acceso. ¿Continuar?')) return;
  const r = await call('docentes.accesosMasivo'); if (!r.ok) return toast(r.error, 'bad');
  const txt = r.data.map(x => x.docente + ' — usuario: ' + x.usuario + ' — PIN: ' + x.pin).join('\n');
  modal('<h3>Accesos creados (' + r.data.length + ')</h3>' + (r.data.length ? '<div class="msg">Anote o copie esta lista y entregue a cada docente su usuario y PIN. <b>Los PIN no se volverán a mostrar.</b></div><div class="tw" style="max-height:320px"><table class="t"><thead><tr><th class="l">Docente</th><th>Usuario</th><th>PIN</th></tr></thead><tbody>' +
    r.data.map(x => '<tr><td class="l">' + esc(x.docente) + '</td><td><b>' + esc(x.usuario) + '</b></td><td><b>' + esc(x.pin) + '</b></td></tr>').join('') + '</tbody></table></div>' : '<p>Todos los docentes activos ya tienen acceso.</p>') +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">' + (r.data.length ? '<button class="btn sec" id="acCopy">Copiar lista</button>' : '') + '<button class="btn" onclick="closeModal()">Listo</button></div>');
  if ($('#acCopy')) $('#acCopy').onclick = () => { try { navigator.clipboard.writeText(txt); toast('Lista copiada.', 'ok'); } catch (e) { toast('No se pudo copiar; anótela a mano.', 'bad'); } };
  cargaCrud();
}
function muestraClaveTemporal(usuario, clave) {
  modal('<h3>PIN de acceso</h3><p>Usuario: <b>' + esc(usuario) + '</b></p><div class="clave">' + esc(clave) + '</div><div class="msg">Anótelo y entréguelo al usuario: <b>no se volverá a mostrar</b>. Puede cambiarlo desde "PIN" en el menú superior.</div><div style="text-align:right"><button class="btn" onclick="closeModal()">Listo</button></div>');
}
async function modalCrud(o) {
  const M = S.crud, mt = M.meta, edita = !!o;
  const refs = {};
  for (const c of mt.campos.filter(c => c.tipo === 'ref')) refs[c.k] = (await call('crud.opciones', { ref: c.ref, ano: edita ? (o.ANO_ESCOLAR || S.ano) : S.ano }, true)).data || [];
  const campo = c => {
    const v = edita ? (o[c.k] === undefined ? '' : o[c.k]) : (c.k === 'ANO_ESCOLAR' ? ($('#kAno') ? $('#kAno').value : S.ano) : (c.defecto !== undefined ? c.defecto : ''));
    const dis = (edita && c.soloCrear) ? ' disabled' : '', id = ' id="f_' + c.k + '"';
    let inp;
    if (c.tipo === 'ref') inp = '<select' + id + dis + '><option value="">— Seleccione —</option>' + refs[c.k].map(x => '<option value="' + esc(x.id) + '"' + (String(x.id) === String(v) ? ' selected' : '') + '>' + esc(x.texto) + '</option>').join('') + '</select>';
    else if (c.tipo === 'enum') inp = '<select' + id + dis + '><option value="">—</option>' + c.opciones.map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>';
    else if (c.tipo === 'si_no') inp = '<select' + id + dis + '><option' + (v !== 'NO' ? ' selected' : '') + '>SI</option><option' + (v === 'NO' ? ' selected' : '') + '>NO</option></select>';
    else inp = '<input' + id + dis + ' value="' + esc(v) + '"' + (c.tipo === 'num' ? ' inputmode="decimal"' : '') + (c.k === 'SECCION' ? ' maxlength="3" style="text-transform:uppercase"' : '') + (c.k === 'PIN' ? ' maxlength="4" inputmode="numeric" placeholder="Automático"' : '') + '>';
    return '<label>' + esc(c.et) + (c.req ? ' *' : '') + '</label>' + inp;
  };
  modal('<h3>' + (edita ? 'Editar ' : 'Nuevo ') + esc(mt.singular.toLowerCase()) + '</h3>' + mt.campos.map(campo).join('') +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="kOk">Guardar</button></div>');
  $('#kOk').onclick = async () => {
    const datos = {}; mt.campos.forEach(c => { const el = $('#f_' + c.k); if (el && !el.disabled) datos[c.k] = c.k === 'SECCION' ? el.value.toUpperCase() : el.value; });
    const r = await call('crud.guardar', { modulo: M.mod, id: edita ? o[mt.idKey] : '', datos });
    if (!r.ok) return toast(r.error, 'bad');
    closeModal();
    if (r.data && r.data.claveTemporal) muestraClaveTemporal(datos.USUARIO || o.USUARIO, r.data.claveTemporal); else toast('Guardado correctamente.', 'ok');
    if (M.mod === 'cursos') recargaCursos();
    cargaCrud();
  };
}
function modalDuplicarPeriodos() {
  modal('<h3>Copiar períodos a otro año escolar</h3><label>Año de origen</label><input id="dO" value="' + esc(S.ano) + '"><label>Año de destino (AAAA-AAAA)</label><input id="dD" placeholder="2027-2028">' +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="dOk">Copiar</button></div>');
  $('#dOk').onclick = async () => { const r = await call('periodos.duplicar', { origen: $('#dO').value, destino: $('#dD').value }); if (!r.ok) return toast(r.error, 'bad'); closeModal(); toast(r.data.creados + ' períodos creados.', 'ok'); cargaCrud(); };
}

/* =====================================================================
   ROLES Y PERMISOS
   ===================================================================== */
async function vRoles() {
  const r = await call('roles.listar');
  if (!r.ok) { $('#main').innerHTML = '<h2>Roles y permisos</h2><div class="msg bad">' + esc(r.error) + '</div>'; return; }
  const d = r.data, mods = [...new Set(d.catalogo.map(p => p.modulo))];
  $('#main').innerHTML = '<h2>Roles y permisos</h2><div class="msg info">Cada permiso controla una acción concreta. El rol Administrador siempre tiene todos. Al guardar, las sesiones abiertas de ese rol se cierran para aplicar los cambios.</div>' +
    (d.puedeAdministrar ? '<div class="bar"><div class="grow"></div><button class="btn" id="rNuevo">+ Nuevo rol</button></div>' : '') +
    d.roles.map(ro => '<div class="card" data-rol="' + esc(ro.id) + '"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3 style="margin:0">' + esc(ro.nombre) + ' ' + (ro.sistema ? '<span class="chip info">sistema</span>' : '') + '</h3><div class="status">' + esc(ro.descripcion || '') + ' · ' + ro.usuarios + ' usuario(s)</div></div>' +
      (d.puedeAdministrar && ro.id !== 'ADMINISTRADOR' ? '<div><button class="btn ok sm" data-g="' + esc(ro.id) + '">Guardar permisos</button></div>' : '') + '</div>' +
      mods.map(m => '<div class="permgrp"><b>' + esc(m) + '</b>' + d.catalogo.filter(p => p.modulo === m).map(p => '<label title="' + esc(p.descripcion) + '"><input type="checkbox" data-p="' + esc(p.id) + '"' + (ro.permisos.includes(p.id) ? ' checked' : '') + (ro.id === 'ADMINISTRADOR' || !d.puedeAdministrar ? ' disabled' : '') + '>' + esc(p.id.split('.')[1]) + '</label>').join('') + '</div>').join('') + '</div>').join('');
  $('#main').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'rNuevo') {
      modal('<h3>Nuevo rol</h3><label>Nombre</label><input id="nrN"><label>Descripción</label><input id="nrD"><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="nrOk">Crear</button></div>');
      $('#nrOk').onclick = async () => { const x = await call('roles.guardar', { nombre: $('#nrN').value, descripcion: $('#nrD').value, permisos: [] }); if (!x.ok) return toast(x.error, 'bad'); closeModal(); toast('Rol creado. Marque sus permisos y guarde.', 'ok'); vRoles(); };
    } else if (b.dataset.g) {
      const card = b.closest('.card'), permisos = $$('input[data-p]:checked', card).map(x => x.dataset.p);
      const x = await call('roles.guardar', { id: b.dataset.g, permisos }); if (!x.ok) return toast(x.error, 'bad'); toast('Permisos guardados (' + permisos.length + ').', 'ok');
    }
  };
}

/* =====================================================================
   HISTORIAL (auditoría)
   ===================================================================== */
async function vHist() {
  const H = S.hist = { q: '', modulo: '', pagina: 1 };
  $('#main').innerHTML = '<h2>Historial de actividad</h2><div class="bar"><label>Buscar<input type="search" id="hQ" placeholder="Usuario, descripción o ID…"></label><label>Módulo<select id="hM"><option value="">Todos</option></select></label></div><div id="hBody"></div>';
  let tmr; $('#hQ').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { H.q = e.target.value; H.pagina = 1; cargaHist(); }, 300); };
  $('#hM').onchange = e => { H.modulo = e.target.value; H.pagina = 1; cargaHist(); };
  cargaHist(true);
}
async function cargaHist(primera) {
  const H = S.hist, r = await call('historial.listar', { q: H.q, modulo: H.modulo, pagina: H.pagina }, !primera);
  if (S.view !== 'hist') return;
  const box = $('#hBody'); if (!r.ok) { box.innerHTML = '<div class="msg bad">' + esc(r.error) + '</div>'; return; }
  if (primera) $('#hM').innerHTML += r.data.modulos.map(m => '<option>' + esc(m) + '</option>').join('');
  box.innerHTML = '<div class="tw" style="max-height:none"><table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th class="l">Descripción</th><th>Antes</th><th>Después</th></tr></thead><tbody>' +
    r.data.items.map(x => '<tr><td>' + esc(x.FECHA) + '</td><td>' + esc(x.USUARIO) + '</td><td>' + esc(x.ACCION) + '</td><td>' + esc(x.MODULO) + '</td><td class="l" style="white-space:normal">' + esc(x.DESCRIPCION) + '</td><td>' + esc(x.VALOR_ANTERIOR) + '</td><td>' + esc(x.VALOR_NUEVO) + '</td></tr>').join('') + '</tbody></table></div>' + pagerHtml(r.data);
  box.onclick = e => { const b = e.target.closest('button[data-pg]'); if (b) { H.pagina = +b.dataset.pg; cargaHist(); } };
}

init();
</script>
