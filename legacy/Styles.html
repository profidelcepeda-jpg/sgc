<style>
:root{--navy:#1f3a5f;--blue:#2e6da4;--bg:#f3f6fa;--card:#fff;--line:#d9e1ec;--txt:#1d2733;--mut:#6b7a90;--ok:#1e8e5a;--warn:#c27c0e;--bad:#c0392b;--info:#2e6da4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
.hidden{display:none!important}
button,select,input,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
#loading{position:fixed;inset:0;background:rgba(243,246,250,.85);display:flex;align-items:center;justify-content:center;z-index:50;font-weight:bold;color:var(--navy)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 14px}
.top .brand{font-weight:bold;font-size:17px;letter-spacing:.3px}.top .brand small{display:block;font-weight:normal;font-size:11px;opacity:.8}

.top .brand{flex:none;width:71px;height:32px;border-radius:6px;background:#fff var(--sga-logo) no-repeat 0 0/100% auto}
.lbox .sga-logo{width:210px;height:139px;max-width:100%;margin:0 auto 14px;background:var(--sga-logo) no-repeat 0 0/100% 100%}
@media(max-width:820px){.top .brand{width:62px;height:28px}}
.top select{background:#fff;color:var(--txt);border:0;border-radius:6px;padding:5px 8px}
.grow{flex:1}
#userBox{font-size:12px;text-align:right;line-height:1.3}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:22px}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav{width:200px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;margin-bottom:2px;color:var(--txt)}
nav button:hover{background:#eef3fa}nav button.on{background:var(--navy);color:#fff}
main{flex:1;padding:16px;min-width:0}
h2{margin:0 0 12px;font-size:20px;color:var(--navy)}h3{margin:16px 0 8px;font-size:15px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.bar select,.bar input[type=text],.bar input[type=search]{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;min-width:130px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:bold}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:#e5ecf6;color:var(--navy)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 13px;color:var(--txt)}.seg button.on{background:var(--navy);color:#fff;font-weight:bold}
/* Calificaciones > Vista: color tenue por botón (solo visual; el botón activo conserva su estilo .on) */
#cModo button[data-m="periodo"]:not(.on){background:#e8f0fb}
#cModo button[data-m="final"]:not(.on){background:#e6f4ea}
#cModo button[data-m="asist"]:not(.on){background:#fdf1dd}
#cModo button[data-m="periodo"]{box-shadow:inset 0 -3px 0 #9db9e0}
#cModo button[data-m="final"]{box-shadow:inset 0 -3px 0 #9ccaa8}
#cModo button[data-m="asist"]{box-shadow:inset 0 -3px 0 #e6c48a}
/* Calificaciones > Período (P1–P4): mismos tonos tenues (solo visual; el botón activo conserva su estilo .on) */
#cPer button[data-p="1"]:not(.on){background:#e8f0fb}
#cPer button[data-p="2"]:not(.on){background:#e6f4ea}
#cPer button[data-p="3"]:not(.on){background:#fdf1dd}
#cPer button[data-p="4"]:not(.on){background:#f0eaf8}
#cPer button[data-p="1"]{box-shadow:inset 0 -3px 0 #9db9e0}
#cPer button[data-p="2"]{box-shadow:inset 0 -3px 0 #9ccaa8}
#cPer button[data-p="3"]{box-shadow:inset 0 -3px 0 #e6c48a}
#cPer button[data-p="4"]{box-shadow:inset 0 -3px 0 #bcaadc}
/* Inicio > Período a analizar (P1–P4): mismos tonos tenues (solo visual; el botón activo conserva su estilo .on) */
#dPer button[data-p="1"]:not(.on){background:#e8f0fb}
#dPer button[data-p="2"]:not(.on){background:#e6f4ea}
#dPer button[data-p="3"]:not(.on){background:#fdf1dd}
#dPer button[data-p="4"]:not(.on){background:#f0eaf8}
#dPer button[data-p="1"]{box-shadow:inset 0 -3px 0 #9db9e0}

th.c1{background:#1f3a5f!important}th.c2{background:#2e6da4!important}th.c3{background:#1f7a8c!important}th.c4{background:#6a4c93!important}

#toast.show{opacity:1}#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
/* reportes (pantalla) */
.rep{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}
.rep .pg{padding:10px;margin:0 auto 14px;border:1px dashed #b7c3d4;background:#fff;overflow:auto}
.rep-head{text-align:center;font-size:11px;line-height:1.35;margin-bottom:6px}.rep-head b{font-size:13px}
.rt{border-collapse:collapse;width:100%;font-size:11px}.rt th,.rt td{border:1px solid #444;padding:2px 3px;text-align:center}.rt th{background:#e4eaf3;font-weight:bold}
.rt td.l{text-align:left}.rt .low{color:#c0392b;font-weight:bold}
.rt.sm{font-size:8.5px}.rt.sm th,.rt.sm td{padding:1px 1px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.ecard{border:1.5px solid #333;padding:4px 6px;break-inside:avoid;font-size:10.5px}
.ecard .r1{display:flex;justify-content:space-between;font-weight:bold}.ecard .nmb{font-weight:bold;font-size:12px;margin:2px 0;text-transform:uppercase}

/* =====================================================================
   ★ IMPRESIÓN / PDF — AQUÍ SE PERSONALIZA EL DISEÑO DE LAS HOJAS
   Todo lo marcado con ★ se puede cambiar sin riesgo.
   ===================================================================== */
/* ★ PAPEL Y MÁRGENES: .25in = margen mínimo en los 4 lados (más pequeño = más área de hoja).
   Si cambia el margen aquí, cámbielo también en --margen (abajo): deben ser iguales.
   Para papel vertical use "letter portrait" (y cambie --hoja-w / --hoja-h). */
@page{size:letter landscape;margin:.25in}
:root{
  --margen:.25in;                                        /* ★ mismo valor que el margen de @page */
  --hoja-w:calc(11in - 2*var(--margen));                 /* ancho útil de la hoja (Carta horizontal = 11in) */
  --hoja-h:calc(8.5in - 2*var(--margen) - .04in);        /* alto útil (−.04in evita hojas en blanco al imprimir) */
  --tj-gris:#e7e6e6;                                     /* ★ color de la barra con el nombre del estudiante */
  --tj-linea:#000;                                       /* ★ color de las líneas de la tabla */
  --tj-fuente-materias:"Times New Roman",Times,serif;    /* ★ letra de asignaturas y notas */
  --tj-fuente-titulos:Calibri,Carlito,Arial,sans-serif;  /* ★ letra de títulos y encabezados */
}

/* ---- HOJA: la vista previa en pantalla tiene el mismo tamaño que la hoja impresa (lo que ve = lo que sale) ---- */
.rep{overflow-x:auto}
.rep .pg.ent,.rep .pg.bol,.rep .pg.bf,.rep .pg.por{
  width:var(--hoja-w);height:var(--hoja-h);box-sizing:border-box;padding:0;border:0;overflow:hidden;
  display:flex;flex-direction:column;background:#fff;margin:0 auto 18px;
  box-shadow:0 0 0 1px #b7c3d4,0 3px 10px rgba(0,0,0,.12)}

/* ---- P1–P3: 4 TARJETAS POR HOJA (2 × 2) ---- */
.rep .pg.ent .cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0}
.cards.corte .tj:nth-child(odd){border-right:1px dashed #555}      /* ★ línea punteada vertical de corte (quite estas 2 líneas si no la quiere) */
.cards.corte .tj:nth-child(-n+2){border-bottom:1px dashed #555}    /* ★ línea punteada horizontal de corte */
.tj{display:flex;flex-direction:column;min-height:0;box-sizing:border-box;overflow:hidden;color:#000;
  padding:.1in .17in .06in;                                         /* ★ espacio interno de cada tarjeta: arriba derecha-izquierda abajo */
  font-family:var(--tj-fuente-titulos)}
.tj-cab{display:flex;align-items:center;gap:.1in;margin-bottom:.05in}
.tj-cab img{height:.5in;width:auto}                                 /* ★ tamaño del logo */
.tj-tx{flex:1;text-align:center;font-size:10px;line-height:1.3}.tj-tx b{font-size:11px}   /* ★ tamaño del texto del encabezado */
.tj-t{flex:1;border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}       /* flex:1 = la tabla se estira hasta llenar la tarjeta */
.tj-t th,.tj-t td{border:1px solid var(--tj-linea);padding:1px 3px;text-align:center;line-height:1.1;font-weight:normal;background:none}
.tj-t th{font-weight:bold}
.tj-t .l{text-align:left}.tj-t .r{text-align:right}
.tj-t th.nom{background:var(--tj-gris);font-size:11px}              /* ★ barra del nombre */
.tj-t tr.m td{font-family:var(--tj-fuente-materias);font-size:11px} /* ★ tamaño de letra de asignaturas y notas */
.tj-t tr.m td.l{white-space:nowrap;overflow:hidden}
.tj-firma{text-align:center;font-size:10px;margin-top:auto;padding-top:.12in}
.tj-firma .ln{width:60%;margin:0 auto;border-top:1px solid #000}
.tj-firma b{display:block}

/* ---- BOLETÍN FINAL (diseño igual al Excel "nota 6toA"): 1 ESTUDIANTE = 1 HOJA COMPLETA ---- */
:root{--bf-teal:#17a2a0;--bf-claro:#cde8e6}                         /* ★ colores: barra de título (verde azulado) y fondo claro de rótulos */
.pg.bf{font-family:var(--tj-fuente-titulos);color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bf-top{display:grid;grid-template-columns:.62in 1fr 1.7in 1.2in;align-items:end;column-gap:.14in;font-weight:bold;padding:.02in 0 .06in}   /* ★ línea: No. / Nombre / Grado / Sección (≈ el doble del tamaño anterior) */
.bf-top .n{font-size:26px;line-height:1;text-align:center;color:var(--bf-teal,#000);border:2px solid var(--bf-teal,#000);border-radius:4px;padding:4px 0 3px}
.bf-top .f{display:flex;flex-direction:column;min-width:0}
.bf-top .f small{font-size:9px;line-height:1.1;letter-spacing:.4px;text-transform:uppercase;color:#444}
.bf-top .f b{font-size:21px;line-height:1.15;border-bottom:1.5px solid #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-bar{background:var(--bf-teal);color:#fff;text-align:center;font-weight:bold;font-size:13px;height:.26in;line-height:.26in;border:1px solid #000;border-bottom:0}
.bf-t{flex:none;width:100%;border-collapse:collapse;table-layout:fixed}
.bf-t th,.bf-t td{border:1px solid #000;padding:1px 2px;text-align:center;line-height:1.1;background:none;overflow:hidden}
.bf-t th{font-size:7.5px;font-weight:bold;white-space:pre-line}     /* ★ tamaño de los encabezados */
.bf-t td{font-size:10px}                                             /* ★ tamaño de las notas */
.bf-t td.an{font-weight:bold;font-size:9px}                          /* ★ nombre del área */
.bf-t tr.h1,.bf-t tr.h2{height:.26in}.bf-t tr.h3{height:.24in}       /* ★ alto de las 3 filas de encabezado */
.bf-t tr.br{height:var(--bf-fila,.46in)}                             /* alto de cada fila de área (se calcula con IMP.boletin.alturaAreas) */
.bf-t .low{color:#c0392b;font-weight:bold}
.bf-t .vt{position:relative;padding:0}                               /* celdas con texto girado 90° */
.bf-t .vt span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);text-align:center;line-height:1.05;font-weight:bold;font-size:7.5px;white-space:normal}
.bf-t .v2 span{width:.5in}.bf-t .v3 span{width:.74in}
.bf-t td.vl{background:var(--bf-claro)}.bf-t td.vl span{white-space:nowrap;font-size:9px}
.bf-t td.so span{width:.44in;white-space:normal;font-size:6px}
.bf-bot{display:flex;gap:.06in;margin-top:.06in;flex:1 1 auto;min-height:0}   /* ★ separación ≈1.5 mm entre cuadros; ocupa el alto restante de la hoja (asistencia / leyenda / situación) */
.bf-box{border:2px solid #000;box-sizing:border-box;display:flex;flex-direction:column;min-height:0}
.bf-ttl{font-weight:bold;font-size:10.5px;text-align:center;padding:2px;border-bottom:1.5px solid #000}
.bf-ttl.claro{background:var(--bf-claro)}
.bf-asis{width:3.2in}.bf-ley{width:2.6in}
.bf-as{flex:1;width:100%;border-collapse:collapse;table-layout:fixed}
.bf-as th,.bf-as td{border:1px solid #000;padding:0 2px;text-align:center;font-size:10.5px;line-height:1.1;background:none}
.bf-as th{font-weight:bold;font-size:9.5px}
.bf-lg{flex:1;padding:2px 5px;font-size:9px;line-height:1.22}.bf-lg b{display:inline-block;width:.56in;font-weight:normal}
.bf-der{flex:1;min-width:0;display:flex;flex-direction:column;gap:.06in}
.bf-sit{display:grid;grid-template-columns:1fr auto .38in auto .38in;border:2px solid #000;font-weight:bold;font-size:11px}
.bf-sit>div{padding:4px 7px;border-left:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-size:13px}
.bf-sit>div:first-child{border-left:0;font-size:11px}.bf-sit>div.l{font-size:11px}
.bf-cond{border:2px solid #000;text-align:center;font-weight:bold;font-size:11px;padding:3px}
.bf-msg{flex:1;min-height:0;border:2px solid #000;padding:4px 8px;font-size:10.5px;line-height:1.3;overflow:hidden}
.bf-firmas{display:flex;justify-content:space-around;text-align:center;font-size:10px;line-height:1.25}
.bf-firmas b{text-decoration:underline}.bf-firmas i{display:block}

/* ---- PORTADA: hoja completa ---- */
.pg.por .portada{flex:1;min-height:0;padding:0 20px;display:flex;flex-direction:column;justify-content:center;align-items:center}

/* ---- AL IMPRIMIR: quitar menús, sombras y separaciones; una hoja por salto de página ---- */

/* ---- BOLETÍN CON PORTADA (hoja 1 frontal: carta horizontal, izq.=contraportada, der.=portada) ---- */
.pg.por.cv-hoja1{width:var(--hoja-w);height:var(--hoja-h);padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;color:#222;background:#fff;overflow:hidden}
.pg.por.cv-hoja1 .cv-spread{display:grid;grid-template-columns:1fr 1fr;height:100%;gap:0}
.pg.por.cv-hoja1 .cv-half{width:auto;height:100%;padding:0.55in 0.5in 0.45in;display:flex;flex-direction:column;box-sizing:border-box;min-width:0;overflow:hidden}
/* ★ Márgenes de la portada, medidos desde el borde del papel (a --margen se le resta lo que ya deja @page).
   Izquierda: .5in por fuera y .5in junto al doblez. Derecha: .54in por todos lados. Arriba .55in. Abajo .14in. */
.pg.por.cv-hoja1 .cv-left{padding:calc(.55in - var(--margen)) .5in .14in calc(.5in - var(--margen))}
.pg.por.cv-hoja1 .cv-right{padding:calc(.55in - var(--margen)) calc(.54in - var(--margen)) .14in .54in}
/* Izquierda */
.cv-hoja1 .banda{background:var(--acento);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.3px;text-align:center;padding:6px 8px;text-transform:uppercase}
.cv-hoja1 .tit-periodos{text-align:center;font-size:12.5px;margin:14px 0 10px}
.cv-hoja1 .per{display:flex;align-items:flex-end;gap:10px;font-size:12px;margin:0 0 15px 22px}
.cv-hoja1 .per span{white-space:nowrap;width:105px}
.cv-hoja1 .per i{flex:1;border-bottom:1px solid #555;height:14px;margin-right:22px}
.cv-hoja1 .sit{margin-top:34px}
.cv-hoja1 .sit-tabla{width:100%;border-collapse:collapse;margin-top:16px;table-layout:fixed}
.cv-hoja1 .sit-tabla th{background:var(--acento);color:var(--cab-texto);font-size:9px;font-weight:700;text-transform:uppercase;padding:6px 4px;border:1px solid #555;line-height:1.2}
.cv-hoja1 .sit-tabla td{height:78px;border:1px solid #555}
.cv-hoja1 .obs-et{font-size:9.5px;margin:14px 0 0;text-transform:uppercase}
.cv-hoja1 .obs-lin{margin:22px 6px 0 14px}
.cv-hoja1 .obs-lin i{display:block;border-bottom:1px solid #666;height:27px}
.cv-hoja1 .firmas{margin-top:auto;margin-bottom:.4in;display:flex;gap:30px;padding:0 6px}   /* ★ margin-bottom = cuánto suben las firmas */
.cv-hoja1 .firmas div{flex:1;text-align:center;font-size:10px}
.cv-hoja1 .firmas .nom{font-weight:700;font-size:10px;min-height:13px}
.cv-hoja1 .firmas .lin{border-top:1px solid #333;margin-top:4px;padding-top:3px}
.cv-hoja1 .sit-tabla td.mk{text-align:center;vertical-align:middle;font-size:46px;font-weight:700;line-height:1;color:#222}
/* Derecha */
.cv-hoja1 .logos{display:flex;justify-content:center;align-items:center;gap:14px;height:92px}
.cv-hoja1 .logos img{max-height:92px;max-width:150px;object-fit:contain}
.cv-hoja1 .mini{text-align:center;line-height:1.2;margin:10px -0.2in 0}
.cv-hoja1 .mini-sup{display:block;font-size:21px;font-weight:400;letter-spacing:-1px;white-space:nowrap}
.cv-hoja1 .mini-centro{display:block;font-size:26px;font-weight:700;white-space:nowrap;margin-top:2px}
.cv-hoja1 .mini-lema{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-style:italic;font-weight:600;letter-spacing:.6px;color:var(--acento);white-space:nowrap;margin-top:5px}
.cv-hoja1 .mini-lema::before,.cv-hoja1 .mini-lema::after{content:'';width:34px;border-top:1.5px solid var(--acento)}
.cv-hoja1 .titulo{text-align:center;font-weight:700;font-size:23px;margin:18px 0 12px}   /* 18px (antes 26) compensa la tercera línea bajo el logo */
.cv-hoja1 .insignia{position:relative;width:190px;height:112px;margin:0 auto 18px}
.cv-hoja1 .insignia .num{position:absolute;left:2px;top:0;font-size:74px;font-weight:800;color:var(--acento);line-height:1;z-index:2}
.cv-hoja1 .insignia .num sup{font-size:17px;vertical-align:top;position:relative;top:8px;left:2px}
.cv-hoja1 .insignia .grado{position:absolute;left:42px;top:26px;width:128px;height:46px;background:var(--verde);color:#fff;font-weight:700;font-size:29px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.cv-hoja1 .insignia .ciclo{position:absolute;left:42px;top:72px;width:128px;background:#e3eee9;text-align:center;padding:3px 0 4px}
.cv-hoja1 .insignia .ciclo b{display:block;color:var(--verde);font-size:11.5px;letter-spacing:.4px}
.cv-hoja1 .insignia .ciclo small{display:block;color:#5b7a6c;font-size:8px;letter-spacing:.3px;text-transform:uppercase}
.cv-hoja1 .form{margin-top:26px;padding:0 4px}
.cv-hoja1 .f{display:flex;align-items:flex-end;margin:0 0 17px;font-size:11.5px}
.cv-hoja1 .f .et{background:none;font-weight:700;text-transform:uppercase;font-size:11.5px;padding:1px 4px;white-space:nowrap;letter-spacing:.1px}
.cv-hoja1 .f .val{flex:1;border-bottom:1px solid #444;min-height:16px;padding:0 5px 1px;font-size:12px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-hoja1 .f .sep{padding:0 6px;font-size:11px}
.cv-hoja1 .f .cor{width:70px;flex:none}
